<div class="amigos-wrapper">
  <!-- CABECERA -->
  <header class="dashboard-header">
    <div class="header-left">
      <a routerLink="/paginaPrincipal" class="header-logo">
        <img src="logo.png" alt="Logo Xuxemons" class="logo" />
        <span class="logo-text">Xuxemons</span>
      </a>
    </div>
    <div class="header-right">
      <div class="header-user">
        <img
          src="https://i.pinimg.com/736x/0f/68/94/0f6894e539589a50809e45833c8bb6c4.jpg"
          alt="Avatar del usuario"
          class="header-avatar"
        />
        <div class="header-user-info">
          <span class="header-user-name">{{ usuario?.name }} {{ usuario?.surname }}</span>
          <span class="header-user-id">{{ usuario?.public_id }}</span>
        </div>
      </div>
    </div>
  </header>
</div>
