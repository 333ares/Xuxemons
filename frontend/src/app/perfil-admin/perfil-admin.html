<body>
  <main>
    <div class="perfil-admin-wrapper">
      <div class="perfil-admin-layout">
        <!-- COLUMNA IZQUIERDA: datos del administrador -->
        <aside class="admin-lateral" aria-label="Información del administrador">
          <div class="avatar-wrapper">
            <!-- Icono de admin en lugar de foto de perfil -->
            <div class="avatar-admin-icon" aria-hidden="true">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="72"
                height="72"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#000000"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                focusable="false"
              >
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" />
              </svg>
            </div>
          </div>

          <h1 class="admin-nombre">{{ admin?.name }} {{ admin?.surname }}</h1>
          <p class="admin-id">ID: {{ admin?.public_id }}</p>

          <span class="badge-admin">Administrador</span>

          <div class="admin-datos">
            <div class="dato-row">
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#FFAA4A"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                focusable="false"
              >
                <path
                  d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"
                />
                <polyline points="22,6 12,13 2,6" />
              </svg>
              <span>{{ admin?.email }}</span>
            </div>

            <div class="dato-row">
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#FFAA4A"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                focusable="false"
              >
                <rect x="2" y="3" width="20" height="14" rx="2" ry="2" />
                <line x1="8" y1="21" x2="16" y2="21" />
                <line x1="12" y1="17" x2="12" y2="21" />
              </svg>
              <span>Panel de Administración</span>
            </div>
          </div>

          <p class="fecha-registro">Miembro desde: {{ admin?.created_at | date: 'dd MMM yyyy' }}</p>

          <div class="botones-lateral">
            <button class="btn-cerrar-sesion" type="button" (click)="cerrarSesion()">
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                focusable="false"
              >
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                <polyline points="16 17 21 12 16 7" />
                <line x1="21" y1="12" x2="9" y2="12" />
              </svg>
              Cerrar sesión
            </button>
          </div>
        </aside>
