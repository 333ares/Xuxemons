<div class="mo-wrapper">
  <!--  CABECERA  -->
  <header class="mant-header">
    <a routerLink="/paginaPrincipal" class="mant-logo">
      <img src="logo.png" alt="Logo Xuxemons" />
      <span class="mant-logo-text">Xuxemons</span>
    </a>
    <img
      src="https://i.pinimg.com/736x/0f/68/94/0f6894e539589a50809e45833c8bb6c4.jpg"
      alt="Avatar"
      class="mant-header-avatar"
    />
  </header>

  <main class="mo-main">
    <!-- CARGANDO -->
    @if (cargando) {
      <div class="mo-estado" role="status" aria-live="polite" aria-label="Cargando mochila">
        <div class="mo-spinner" aria-hidden="true"></div>
        <p>Cargando tu mochila...</p>
      </div>
    }

    <!-- ERROR -->
    @if (!cargando && error) {
      <div class="mo-estado mo-estado--error" role="alert">
        <span aria-hidden="true">⚠️</span>
        <p>{{ error }}</p>
        <button class="mo-btn-reintentar" (click)="cargarMochila()">Volver a intentarlo</button>
      </div>
    }

  <!-- BARRA DE NAVEGACIÓN INFERIOR -->
  <app-nav></app-nav>
</div>
