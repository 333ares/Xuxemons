<div class="xdex-wrapper">
  <header class="mant-header">
    <a routerLink="/paginaPrincipal" class="mant-logo">
      <img src="logo.png" alt="Logo Xuxemons" />
      <span class="mant-logo-text">Xuxemons</span>
    </a>
    <img
      src="https://i.pinimg.com/736x/0f/68/94/0f6894e539589a50809e45833c8bb6c4.jpg"
      alt="Avatar usuario"
      class="mant-header-avatar"
    />
  </header>

  <main class="xdex-main">
    @if (cargando) {
      <div class="xdex-estado" role="status" aria-live="polite" aria-label="Carregant Xuxemons">
        <div class="xdex-spinner" aria-hidden="true"></div>
        <p>Cargando tus Xuxemons...</p>
      </div>
    }

    @if (!cargando && error) {
      <div class="xdex-estado xdex-estado--error" role="alert">
        <span class="xdex-estado__icono" aria-hidden="true">⚠️</span>
        <p>{{ error }}</p>
        <button class="xdex-btn-reintentar" (click)="cargarXuxemons()">Vuelvelo a intentar</button>
      </div>
    }

    @if (!cargando && !error && todosLosGrupos.length === 0) {
      <div class="xdex-estado xdex-estado--vacio" role="status">
        <div class="xdex-estado__icono-wrapper" aria-hidden="true">
          <svg
            width="48"
            height="48"
            viewBox="0 0 37 40"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M16.5855 0.107391C14.1012 0.443329 11.9762 1.50583 10.1793 3.31052C8.54648 4.93552 7.50741 6.88083 7.04648 9.14646C6.94491 9.67771 6.86679 11.084 6.85898 12.584C6.85898 12.6543 6.71054 12.7949 6.53085 12.9043C4.50742 14.0996 1.8746 18.5683 0.726166 22.7793C-0.430084 26.9746 -0.195709 29.9355 1.35898 30.9277C2.35898 31.5605 3.47617 31.3652 4.75742 30.334L5.27304 29.9199L5.45273 30.5605C5.7496 31.6465 6.26523 32.8418 6.82773 33.7168L7.08554 34.123L6.77304 34.498C5.98398 35.4433 5.57773 36.7793 5.6246 38.3027C5.64804 39.2715 5.71054 39.4355 6.1871 39.7871C6.39804 39.9511 6.4996 39.9511 10.8199 39.9746C14.5699 39.9902 15.2652 39.9746 15.4605 39.8808C15.648 39.7871 15.7809 39.7793 16.1793 39.8496C16.7887 39.9668 19.4059 39.9668 20.0152 39.8574C20.3824 39.7949 20.5387 39.7949 20.734 39.8808C20.9449 39.9668 21.8199 39.9902 25.2965 39.9902C30.0699 39.9902 29.9449 40.0058 30.3433 39.4746L30.5699 39.1777L30.5621 38.0058C30.5543 36.959 30.5308 36.7558 30.3512 36.2011C30.1246 35.5136 29.7183 34.7715 29.3433 34.3886L29.109 34.1465L29.2574 33.9199C29.7808 33.1855 30.523 31.5058 30.8043 30.4433L30.9449 29.9199L31.4215 30.3183C31.6793 30.5371 32.1637 30.8418 32.484 30.998C34.1012 31.7636 35.5387 30.9824 36.0387 29.0605C37.0933 24.9746 33.3824 15.334 29.8512 13.0136C29.5855 12.834 29.359 12.6543 29.3512 12.6074C29.3512 12.5683 29.3355 11.8965 29.3277 11.123C29.2965 9.56833 29.1793 8.77927 28.8043 7.63083C27.6168 3.98239 24.7262 1.27145 21.0387 0.357391C19.5777 -0.00979614 18.0387 -0.0957336 16.5855 0.107391Z"
              fill="#FFAA4A"
              opacity="0.3"
            />
          </svg>
        </div>
        <h2 class="xdex-estado__titulo">Aun no tienes ningun Xuxemon</h2>
        <p class="xdex-estado__msg">Cuando el administrador te asigne un Xuxemon, te aparecera aqui.</p>
      </div>
    }


  <app-nav></app-nav>
